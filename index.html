<style>
:root{
  --bg:#131019;
  --bg-elev:#1b1725;
  --surface:#221d30;
  --surface2:#2b2440;
  --border:#3a3350;
  --gold:#cda449;
  --gold-dim:#8a7233;
  --gold-soft:rgba(205,164,73,0.15);
  --indigo:#7d8cff;
  --danger:#e5535a;
  --danger-soft:rgba(229,83,90,0.15);
  --success:#38caa0;
  --success-soft:rgba(56,202,160,0.15);
  --text:#f3f0ea;
  --text-dim:#a79fc0;
  --text-faint:#6d6585;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Noto Sans JP', sans-serif;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; position:relative;}

/* ===== header ===== */
header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  gap:8px;
}
.brand{display:flex; align-items:center; gap:8px; min-width:0;}
.brand .mark{
  font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px;
  font-size:18px; color:var(--gold); border:1.5px solid var(--gold); border-radius:6px;
  padding:2px 7px 2px 8px; text-align:center; line-height:1.3; flex:0 0 auto;
}
.brand .titles{min-width:0;}
.brand .sub{font-size:11px; color:var(--text-faint); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand .page-title{font-size:13.5px; color:var(--text-dim); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.header-actions{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.staff-chip{
  display:flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border);
  border-radius:20px; padding:5px 10px 5px 8px; font-size:12px; color:var(--text); font-weight:700;
}
.staff-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 6px var(--success);}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--success); display:inline-block; box-shadow:0 0 6px var(--success);}
.sync-dot.offline{background:var(--danger); box-shadow:0 0 6px var(--danger);}
.sync-dot.pending{background:var(--gold); box-shadow:0 0 6px var(--gold); animation:pulseDot 1s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.35;}}
.icon-btn{

function todayStr(){
  var d = new Date();
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function fmtDateJp(dateStr){ return String(dateStr||'').split('-').join('/'); }
function fmtHM(ts){
  if(!ts) return '';
  var d = new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function staffName(id){ var s = STAFF.filter(function(x){return x.id===id;})[0]; return s ? s.name : (id||''); }

/* ---------- localStorage 補助 ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsGetJSON(k, fallback){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSetJSON(k, v){ return lsSet(k, JSON.stringify(v)); }

/* ---------- オブジェクト⇔配列変換（Firebaseは配列よりID付きオブジェクト推奨） ---------- */
function arrToObj(arr){ var o={}; arr.forEach(function(x){ o[x.id]=x; }); return o; }
function objToArr(obj){ return Object.keys(obj||{}).map(function(k){ return obj[k]; }); }
function logToArr(logObj){
  var arr = Object.keys(logObj||{}).map(function(k){ return logObj[k]; });
  arr.sort(function(a,b){ return (a.at||0)-(b.at||0); });
  return arr;
}

/* ---------- 派生データ ---------- */
function activeCategories(){
  return categories.filter(function(c){ return !c.deleted; }).slice().sort(function(a,b){ return a.order-b.order; });
}
function activeItemsForCategory(catId){
  return items.filter(function(it){ return !it.deleted && it.categoryId===catId; }).slice().sort(function(a,b){ return a.order-b.order; });
}
function activeItemsAll(){
  return items.filter(function(it){ return !it.deleted; });
}
function itemState(itemId){
  var d = (dayDoc && dayDoc.items) ? dayDoc.items[itemId] : null;
  if(!d) return {checked:false, checkedBy:null, checkedAt:null, log:[]};
  return {
    checked: !!d.checked,
    checkedBy: d.checkedBy || null,
    checkedAt: d.checkedAt || null,
    log: logToArr(d.log)
  };
}
function computeProgress(){
  var all = activeItemsAll();
  var total = all.length, done = 0;
  for(var i=0;i<all.length;i++){ if(itemState(all[i].id).checked) done++; }
  return {done:done, total:total, pct: total ? Math.round(done/total*100) : 0};
}
function computeTally(){
  var counts = {};
  STAFF.forEach(function(s){ counts[s.id]=0; });
  var all = activeItemsAll();
  for(var i=0;i<all.length;i++){
    var st = itemState(all[i].id);
    if(st.checked && st.checkedBy && counts.hasOwnProperty(st.checkedBy)) counts[st.checkedBy]++;
  }
  return STAFF.map(function(s){ return {id:s.id, name:s.name, n:counts[s.id]||0}; });
}

/* ---------- チェック操作（UI起点・楽観的更新・Firebaseへ即時書き込み） ---------- */
/* リアルタイムDBへの書き込みはページ再読み込みを伴わないため、
   旧artifact版のようなデバウンス／キュー機構は不要。各タップは
   それぞれ別パスへの独立した書き込みなので、同時操作でも競合しない。 */
function setItemChecked(itemId, checked, staffId){
  var ts = Date.now();
  var date = todayStr();
  checkDateRollover();
  if(!dayDoc) dayDoc = {date:date, items:{}};
  if(!dayDoc.items) dayDoc.items = {};
  var existing = dayDoc.items[itemId] || {checked:false, checkedBy:null, checkedAt:null, log:{}};
  var logKey = 'l_' + genId('x');
  var newLog = Object.assign({}, existing.log||{});
  newLog[logKey] = {a: checked?'c':'u', by: staffId, at: ts};
  dayDoc.items[itemId] = {checked:checked, checkedBy: checked?staffId:null, checkedAt: checked?ts:null, log:newLog};
  allDays[date] = dayDoc;
  renderAll();

  var updates = {};
  updates['days/'+date+'/items/'+itemId+'/checked'] = checked;
  updates['days/'+date+'/items/'+itemId+'/checkedBy'] = checked ? staffId : null;
  updates['days/'+date+'/items/'+itemId+'/checkedAt'] = checked ? ts : null;
  updates['days/'+date+'/items/'+itemId+'/log/'+logKey] = {a: checked?'c':'u', by: staffId, at: ts};
  update(rootRef, updates).catch(function(err){
    console.error('write failed', err);
    toast('保存に失敗しました。通信環境を確認してください');
  });
}

function requestUncheck(itemId){
  var itDef = items.filter(function(x){return x.id===itemId;})[0];
  showConfirmModal({
    title: '確認',
    body: (itDef?itDef.name:'この項目') + ' のチェックを取り消しますか？',
    confirmLabel: '取り消す',
    cancelLabel: 'キャンセル',
    danger: true,
    onConfirm: function(){ setItemChecked(itemId, false, currentStaffId); }
  });
}

function handleItemTap(itemId){
  if(!currentStaffId) return;
  var st = itemState(itemId);
  if(st.checked){ requestUncheck(itemId); }
  else { setItemChecked(itemId, true, currentStaffId); }
}

function persistOrderItems(){
  set(ref(db, 'orderItems'), arrToObj(orderItems)).catch(function(err){

  });

function addOrderCategory(name){
  name=(name||'').trim(); if(!name) return;
  var maxOrder = orderCategories.reduce(function(m,c){return Math.max(m,c.order||0);},0);
  orderCategories.push({id:genId('ocat'), name:name, order:maxOrder+1, deleted:false});
  persistOrderCategories(); renderAll();
}
function editOrderCategoryName(id, name){
  name=(name||'').trim(); if(!name) return;
  orderCategories = orderCategories.map(function(c){ return c.id===id ? Object.assign({},c,{name:name}) : c; });
  persistOrderCategories();
}
function deleteOrderCategory(id){
  var cat = orderCategories.filter(function(c){return c.id===id;})[0];
  showConfirmModal({
    title:'カテゴリを削除',
    body:(cat?cat.name:'このカテゴリ')+' を削除しますか？含まれる項目の履歴は保持されます。',
    confirmLabel:'削除する', cancelLabel:'キャンセル', danger:true,
    onConfirm:function(){
      orderCategories = orderCategories.map(function(c){ return c.id===id ? Object.assign({},c,{deleted:true}) : c; });
      persistOrderCategories(); renderAll();
    }
  });
}
function restoreOrderCategory(id){
  orderCategories = orderCategories.map(function(c){ return c.id===id ? Object.assign({},c,{deleted:false}) : c; });
  persistOrderCategories(); renderAll();
}
function moveOrderCategory(id, dir){
  var active = orderCategories.filter(function(c){return !c.deleted;}).sort(function(a,b){return a.order-b.order;});
  var idx = active.findIndex(function(c){return c.id===id;});
  var swapIdx = dir==='up' ? idx-1 : idx+1;
  if(idx<0 || swapIdx<0 || swapIdx>=active.length) return;
  var a = active[idx], b = active[swapIdx], oa=a.order, ob=b.order;
  orderCategories = orderCategories.map(function(c){
    if(c.id===a.id) return Object.assign({},c,{order:ob});
    if(c.id===b.id) return Object.assign({},c,{order:oa});
    return c;
  });
  persistOrderCategories(); renderAll();
}
function addOrderItem(catId, name){
  name=(name||'').trim(); if(!name) return;
  var sameCat = orderItems.filter(function(it){return it.categoryId===catId;});
  var maxOrder = sameCat.reduce(function(m,it){return Math.max(m,it.order||0);},0);
  orderItems.push({id:genId('oi'), categoryId:catId, name:name, order:maxOrder+1, deleted:false});
  persistOrderItems(); renderAll();
}
function editOrderItemName(id, name){
  name=(name||'').trim(); if(!name) return;
  orderItems = orderItems.map(function(it){ return it.id===id ? Object.assign({},it,{name:name}) : it; });
  persistOrderItems();
}
function deleteOrderItem(id){

    body:(it0?it0.name:'この項目')+' を削除しますか？履歴は保持されます。',
    confirmLabel:'削除する', cancelLabel:'キャンセル', danger:true,
    onConfirm:function(){
      orderItems = orderItems.map(function(it){ return it.id===id ? Object.assign({},it,{deleted:true}) : it; });
      persistOrderItems(); renderAll();
    }
  });
}
function restoreOrderItem(id){
  orderItems = orderItems.map(function(it){ return it.id===id ? Object.assign({},it,{deleted:false}) : it; });
  persistOrderItems(); renderAll();
}
function moveOrderItem(id, dir){
  var it = orderItems.filter(function(x){return x.id===id;})[0];
  if(!it) return;
  var siblings = orderItems.filter(function(x){return x.categoryId===it.categoryId && !x.deleted;}).sort(function(a,b){return a.order-b.order;});
  var idx = siblings.findIndex(function(x){return x.id===id;});
  var swapIdx = dir==='up'?idx-1:idx+1;
  if(idx<0||swapIdx<0||swapIdx>=siblings.length) return;
  var a=siblings[idx], b=siblings[swapIdx], oa=a.order, ob=b.order;
  orderItems = orderItems.map(function(x){
    if(x.id===a.id) return Object.assign({},x,{order:ob});
    if(x.id===b.id) return Object.assign({},x,{order:oa});
    return x;
  });
  persistOrderItems(); renderAll();
}

function renderOrderTab(){
  var el = document.getElementById('tab-order');
  var prog = computeOrderProgress();
  var tally = computeOrderTally();
  var cats = activeOrderCategories();
  var html = '';

  html += '<div class="progress-card">'
    + '<div class="progress-top"><span class="progress-title">発注チェック</span><span class="progress-date">'+escHtml(fmtDateJp(currentSubscribedDate||todayStr()))+'</span></div>'
    + '<div class="progress-fig"><span class="frac">'+prog.done+'<span>/'+prog.total+'</span></span><span class="pct">'+prog.pct+'%</span></div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+prog.pct+'%"></div></div>'
    + (prog.total>0 && prog.done>=prog.total ? '<div class="progress-done-banner">✓ 発注チェック完了</div>' : '')
    + '</div>';

  html += '<div class="tally-strip">' + tally.map(function(t){
    return '<div class="tally-chip"><div class="n">'+t.n+'</div><div class="who">'+escHtml(t.name)+'</div></div>';
  }).join('') + '</div>';

  if(cats.length===0){
    html += '<div class="empty-hint">発注カテゴリがまだありません。管理タブの「発注項目」から追加してください。</div>';
  }

  cats.forEach(function(cat){
    var catItems = activeOrderItemsForCategory(cat.id);
    var doneCount = catItems.filter(function(it){ return orderItemState(it.id).checked; }).length;
    var collapsed = !!collapsedCats['order_'+cat.id];

    html += '<div class="category-block">';
    html += '<div class="category-header'+(collapsed?' collapsed':'')+'" data-ordercat="'+escAttr(cat.id)+'">'
      + '<span class="name"><span class="chev">▼</span>'+escHtml(cat.name)+'</span>'
      + '<span class="category-count'+(doneCount===catItems.length && catItems.length>0?' done':'')+'">'+doneCount+'/'+catItems.length+'</span>'
      + '</div>';
    html += '<div class="category-items'+(collapsed?' collapsed':'')+'">';
    if(catItems.length===0){
      html += '<div class="empty-hint" style="border:none; padding:16px;">項目がありません</div>';
    }
    catItems.forEach(function(it){
      var st = orderItemState(it.id);
      html += '<div class="item-row'+(st.checked?' checked':'')+'" data-orderitem="'+escAttr(it.id)+'">'
        + '<span class="item-check">✓</span>'
        + '<span class="item-body"><div class="item-name">'+escHtml(it.name)+'</div>'
        + (st.checked ? '<div class="item-meta"><span class="who">'+escHtml(staffName(st.checkedBy))+'</span> · '+fmtHM(st.checkedAt)+'</div>' : '')
        + '</span></div>';
    });
    html += '</div></div>';
  });

  el.innerHTML = html;
}

function performResetToday(staffId){
  var date = todayStr();
  var ts = Date.now();
  var day = allDays[date] || {date:date, items:{}};
  var updates = {};
  Object.keys(day.items||{}).forEach(function(id){
    var it = day.items[id];
    var logKey = 'l_' + genId('x');
    updates['days/'+date+'/items/'+id+'/checked'] = false;
    updates['days/'+date+'/items/'+id+'/checkedBy'] = null;
    updates['days/'+date+'/items/'+id+'/checkedAt'] = null;
    updates['days/'+date+'/items/'+id+'/log/'+logKey] = {a:'r', by:staffId, at:ts};
    var newLog = Object.assign({}, it.log||{});
    newLog[logKey] = {a:'r', by:staffId, at:ts};
    day.items[id] = {checked:false, checkedBy:null, checkedAt:null, log:newLog};
  });
  allDays[date] = day;
  dayDoc = day;
  renderAll();
  return update(rootRef, updates);
}

function checkDateRollover(){
  var date = todayStr();
  if(date !== currentSubscribedDate){
    currentSubscribedDate = date;
    dayDoc = allDays[date] || {date:date, items:{}};
    allDays[date] = dayDoc;
    orderDayDoc = allOrderDays[date] || {date:date, items:{}};
    allOrderDays[date] = orderDayDoc;
    renderAll();
  }
}

/* ---------- 管理：カテゴリ/項目 CRUD ---------- */
function persistCategories(){
  set(ref(db, 'categories'), arrToObj(categories)).catch(function(err){
    console.error('persistCategories failed', err); toast('保存に失敗しました');
  });
}
function persistItems(){
  set(ref(db, 'items'), arrToObj(items)).catch(function(err){
    console.error('persistItems failed', err); toast('保存に失敗しました');
  });
}
function addCategory(name){
  name=(name||'').trim(); if(!name) return;
  var maxOrder = categories.reduce(function(m,c){return Math.max(m,c.order||0);},0);
  categories.push({id:genId('cat'), name:name, order:maxOrder+1, deleted:false});
  persistCategories(); renderAll();
}
function editCategoryName(id, name){
  name=(name||'').trim(); if(!name) return;
  categories = categories.map(function(c){ return c.id===id ? Object.assign({},c,{name:name}) : c; });
  persistCategories();
}
function deleteCategory(id){
  var cat = categories.filter(function(c){return c.id===id;})[0];
  showConfirmModal({
    title:'カテゴリを削除',
    body:(cat?cat.name:'このカテゴリ')+' を削除しますか？含まれる項目の履歴は保持されます。',
    confirmLabel:'削除する', cancelLabel:'キャンセル', danger:true,
    onConfirm:function(){
      categories = categories.map(function(c){ return c.id===id ? Object.assign({},c,{deleted:true}) : c; });
      persistCategories(); renderAll();
    }
  });
}
function restoreCategory(id){
  categories = categories.map(function(c){ return c.id===id ? Object.assign({},c,{deleted:false}) : c; });
  persistCategories(); renderAll();
}
function moveCategory(id, dir){
  var active = categories.filter(function(c){return !c.deleted;}).sort(function(a,b){return a.order-b.order;});
  var idx = active.findIndex(function(c){return c.id===id;});
  var swapIdx = dir==='up' ? idx-1 : idx+1;
  if(idx<0 || swapIdx<0 || swapIdx>=active.length) return;
  var a = active[idx], b = active[swapIdx], oa=a.order, ob=b.order;
  categories = categories.map(function(c){
    if(c.id===a.id) return Object.assign({},c,{order:ob});
    if(c.id===b.id) return Object.assign({},c,{order:oa});
    return c;
  });
  persistCategories(); renderAll();
}
function addItem(catId, name){
  name=(name||'').trim(); if(!name) return;
  var sameCat = items.filter(function(it){return it.categoryId===catId;});
  var maxOrder = sameCat.reduce(function(m,it){return Math.max(m,it.order||0);},0);
  items.push({id:genId('i'), categoryId:catId, name:name, order:maxOrder+1, deleted:false});
  persistItems(); renderAll();
}
function editItemName(id, name){
  name=(name||'').trim(); if(!name) return;
  items = items.map(function(it){ return it.id===id ? Object.assign({},it,{name:name}) : it; });
  persistItems();
}
function deleteItem(id){
  var it0 = items.filter(function(it){return it.id===id;})[0];
  showConfirmModal({
    title:'項目を削除',
    body:(it0?it0.name:'この項目')+' を削除しますか？履歴は保持されます。',
    confirmLabel:'削除する', cancelLabel:'キャンセル', danger:true,
    onConfirm:function(){
      items = items.map(function(it){ return it.id===id ? Object.assign({},it,{deleted:true}) : it; });
      persistItems(); renderAll();
    }
  });
}
function restoreItem(id){
  items = items.map(function(it){ return it.id===id ? Object.assign({},it,{deleted:false}) : it; });
  persistItems(); renderAll();
}
function moveItem(id, dir){
  var it = items.filter(function(x){return x.id===id;})[0];
  if(!it) return;
  var siblings = items.filter(function(x){return x.categoryId===it.categoryId && !x.deleted;}).sort(function(a,b){return a.order-b.order;});
  var idx = siblings.findIndex(function(x){return x.id===id;});
  var swapIdx = dir==='up'?idx-1:idx+1;
  if(idx<0||swapIdx<0||swapIdx>=siblings.length) return;
  var a=siblings[idx], b=siblings[swapIdx], oa=a.order, ob=b.order;
  items = items.map(function(x){
    if(x.id===a.id) return Object.assign({},x,{order:ob});
    if(x.id===b.id) return Object.assign({},x,{order:oa});
    return x;
  });
  persistItems(); renderAll();
}

/* ---------- 履歴タブ ---------- */
var historyCache = [];
function renderHistoryTab(){
  var el = document.getElementById('tab-history');
  if(historyView==='detail' && historyDetailDate){
    renderHistoryDetail(el, historyDetailDate);
    return;
  }
  loadHistoryList();
  var html = '<div class="section-title">過去の記録</div>';
  historyCache.forEach(function(d){
    var doneAll = d.total>0 && d.done>=d.total;
    html += '<div class="hist-day-row" data-histdate="'+escAttr(d.date)+'">'
      + '<span class="date">'+escHtml(fmtDateJp(d.date))+'</span>'
      + '<span class="frac'+(doneAll?' done':'')+'">'+d.done+'/'+d.total+'</span>'
      + '</div>';
  });
  if(historyCache.length===0){ html += '<div class="empty-hint">記録がありません</div>'; }
  el.innerHTML = html;
}
function loadHistoryList(){
  var total = activeItemsAll().length;
  var list = Object.keys(allDays).filter(function(d){ return allDays[d]; }).sort().reverse().slice(0, MAX_HISTORY_DAYS).map(function(date){
    var day = allDays[date];
    var itemsObj = day.items || {};
    var done = Object.keys(itemsObj).filter(function(k){ return itemsObj[k] && itemsObj[k].checked; }).length;
    return {date:date, done:done, total:total, items:itemsObj};
  });
  historyCache = list;
}
function renderHistoryDetail(el, date){
  var day = historyCache.filter(function(d){return d.date===date;})[0];
  var html = '<a class="back-link" id="histBackLink">← 一覧に戻る</a>';
  html += '<div class="section-title">'+escHtml(fmtDateJp(date))+'</div>';
  if(!day){ html += '<div class="empty-hint">データがありません</div>'; el.innerHTML = html; return; }
  var events = [];
  var itemsObj = day.items || {};
  Object.keys(itemsObj).forEach(function(id){
    var itDef = items.filter(function(x){return x.id===id;})[0];
    var name = itDef ? itDef.name : id;
    var log = logToArr(itemsObj[id].log);
    log.forEach(function(ev){ events.push({name:name, a:ev.a, by:ev.by, at:ev.at}); });
  });
  events.sort(function(a,b){ return (b.at||0)-(a.at||0); });
  html += '<div class="card">';
  if(events.length===0){ html += '<div class="empty-hint">記録がありません</div>'; }
  events.forEach(function(ev){
    var actionLabel = ev.a==='c' ? 'チェック' : (ev.a==='u' ? '取り消し' : 'リセット');
    html += '<div class="hist-event-row"><div><div>'+escHtml(ev.name)+'</div><div class="action">'+escHtml(staffName(ev.by))+' が'+actionLabel+'</div></div>'
      + '<div class="time">'+fmtHM(ev.at)+'</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- タブ切替・全体再描画 ---------- */
function switchTab(tab){
  currentTab = tab;
  lsSet('x8oc_tab', tab);
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('#bottomNav button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  document.getElementById('pageTitle').textContent = tab==='check' ? 'OPEN CHECK' : (tab==='order' ? '発注チェック' : (tab==='history' ? '履歴' : '管理'));
  if(tab==='history'){ historyView='list'; historyCache=[]; }
  renderCurrentTab();
}
function renderCurrentTab(){
  if(currentTab==='check') renderCheckTab();
  else if(currentTab==='order') renderOrderTab();
  else if(currentTab==='history') renderHistoryTab();
  else if(currentTab==='admin') renderAdminTab();
}

}

/* ---------- モーダル・トースト ---------- */
function showConfirmModal(opts){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
    + '<div class="modal-box">'
    + '<div class="modal-title">'+escHtml(opts.title||'確認')+'</div>'
    + '<div class="modal-body">'+escHtml(opts.body||'')+'</div>'
    + '<div class="modal-actions">'
    + '<button class="btn ghost" id="modalCancelBtn">'+escHtml(opts.cancelLabel||'キャンセル')+'</button>'
    + '<button class="btn '+(opts.danger?'danger':'gold')+'" id="modalConfirmBtn">'+escHtml(opts.confirmLabel||'OK')+'</button>'
    + '</div></div></div>';
  document.getElementById('modalCancelBtn').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = function(e){ if(e.target.id==='modalOverlay') closeModal(); };
  document.getElementById('modalConfirmBtn').onclick = function(){ closeModal(); if(opts.onConfirm) opts.onConfirm(); };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function showTextModal(title, body, text){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
    + '<div class="modal-box">'
    + '<div class="modal-title">'+escHtml(title)+'</div>'
    + '<div class="modal-body">'+escHtml(body)+'</div>'
    + '<input type="text" id="modalTextInput" value="'+escAttr(text)+'" readonly style="margin-bottom:14px;">'
    + '<div class="modal-actions"><button class="btn gold block" id="modalCopyBtn">コピーする</button></div>'
    + '</div></div>';
  var input = document.getElementById('modalTextInput');
  input.onclick = function(){ input.select(); };
  document.getElementById('modalOverlay').onclick = function(e){ if(e.target.id==='modalOverlay') closeModal(); };
  document.getElementById('modalCopyBtn').onclick = function(){
    input.select();
    try{ document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){}); }
    toast('コピーしました');
    closeModal();
  };
}
var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ---------- 共有 ---------- */
var PUBLIC_URL = 'https://jiggyhouse6666-code.github.io/x8-open-check/';
function shareApp(){
  var url = PUBLIC_URL;
  var shareData = {title:'X8 OPEN CHECK', text:'X8 OPEN CHECK — 営業開始前チェックリスト', url:url};
  if(navigator.share){
    navigator.share(shareData).catch(function(err){
      if(err && err.name==='AbortError') return;
      fallbackShare(url);
    });
  } else {
    fallbackShare(url);
  }
}
function fallbackShare(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast('URLをコピーしました'); })
      .catch(function(){ showTextModal('共有', 'このURLをコピーしてください', url); });
  } else {
    showTextModal('共有', 'このURLをコピーしてください', url);
  }
}

/* ---------- イベント配線 ---------- */
function wireEvents(){
  document.getElementById('staffGate').addEventListener('click', function(e){
    var btn = e.target.closest('[data-staff]');
    if(!btn) return;
    currentStaffId = btn.getAttribute('data-staff');
    lsSet('x8oc_staff', currentStaffId);
    showApp(); renderAll();
  });
  document.getElementById('staffChipBtn').addEventListener('click', function(){ showStaffGate(); });
  document.getElementById('shareBtn').addEventListener('click', shareApp);
  document.getElementById('bottomNav').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if(btn) switchTab(btn.getAttribute('data-tab'));
  });

  var tabCheck = document.getElementById('tab-check');
  tabCheck.addEventListener('click', function(e){
    var header = e.target.closest('.category-header');
    if(header){ var catId=header.getAttribute('data-cat'); collapsedCats[catId]=!collapsedCats[catId]; lsSetJSON('x8oc_collapsed', collapsedCats); renderCheckTab(); return; }
    var row = e.target.closest('.item-row');
    if(row){ handleItemTap(row.getAttribute('data-item')); return; }
    var sw = e.target.closest('#filterSwitch');
    if(sw){ filterIncomplete=!filterIncomplete; lsSet('x8oc_filter', filterIncomplete?'1':'0'); renderCheckTab(); return; }
  });

  var tabHistory = document.getElementById('tab-history');
  tabHistory.addEventListener('click', function(e){
    var row = e.target.closest('.hist-day-row');
    if(row){ historyDetailDate=row.getAttribute('data-histdate'); historyView='detail'; renderHistoryTab(); return; }
    var back = e.target.closest('#histBackLink');
    if(back){ historyView='list'; historyDetailDate=null; renderHistoryTab(); return; }
  });

  var tabOrder = document.getElementById('tab-order');
  tabOrder.addEventListener('click', function(e){
    var header = e.target.closest('.category-header');
    if(header){ var catId=header.getAttribute('data-ordercat'); collapsedCats['order_'+catId]=!collapsedCats['order_'+catId]; lsSetJSON('x8oc_collapsed', collapsedCats); renderOrderTab(); return; }
    var row = e.target.closest('.item-row');
    if(row){ handleOrderItemTap(row.getAttribute('data-orderitem')); return; }
  });

  var tabAdmin = document.getElementById('tab-admin');
  tabAdmin.addEventListener('click', function(e){
    var t = e.target;
    var catmove = t.closest('[data-catmove]'); if(catmove){ moveCategory(catmove.getAttribute('data-id'), catmove.getAttribute('data-catmove')); return; }
    var catdel = t.closest('[data-catdel]'); if(catdel){ deleteCategory(catdel.getAttribute('data-catdel')); return; }
    var catrestore = t.closest('[data-catrestore]'); if(catrestore){ restoreCategory(catrestore.getAttribute('data-catrestore')); return; }
    var addCatBtn = t.closest('#addCatBtn');
    if(addCatBtn){ var input=document.getElementById('newCatName'); addCategory(input.value); input.value=''; return; }
    var itmove = t.closest('[data-itmove]'); if(itmove){ moveItem(itmove.getAttribute('data-id'), itmove.getAttribute('data-itmove')); return; }
    var itdel = t.closest('[data-itdel]'); if(itdel){ deleteItem(itdel.getAttribute('data-itdel')); return; }
    var itrestore = t.closest('[data-itrestore]'); if(itrestore){ restoreItem(itrestore.getAttribute('data-itrestore')); return; }
    var additembtn = t.closest('[data-additembtn]');
    if(additembtn){
      var catId = additembtn.getAttribute('data-additembtn');
      var inp = tabAdmin.querySelector('[data-newitem="'+CSS.escape(catId)+'"]');
      if(inp){ addItem(catId, inp.value); inp.value=''; }
      return;
    }
    var resetBtn = t.closest('#resetTodayBtn'); if(resetBtn){ confirmResetToday(); return; }

    var ocatmove = t.closest('[data-ocatmove]'); if(ocatmove){ moveOrderCategory(ocatmove.getAttribute('data-id'), ocatmove.getAttribute('data-ocatmove')); return; }
    var ocatdel = t.closest('[data-ocatdel]'); if(ocatdel){ deleteOrderCategory(ocatdel.getAttribute('data-ocatdel')); return; }
    var ocatrestore = t.closest('[data-ocatrestore]'); if(ocatrestore){ restoreOrderCategory(ocatrestore.getAttribute('data-ocatrestore')); return; }
    var addOrderCatBtn = t.closest('#addOrderCatBtn');
    if(addOrderCatBtn){ var oInput=document.getElementById('newOrderCatName'); addOrderCategory(oInput.value); oInput.value=''; return; }
    var oitmove = t.closest('[data-oitmove]'); if(oitmove){ moveOrderItem(oitmove.getAttribute('data-id'), oitmove.getAttribute('data-oitmove')); return; }
    var oitdel = t.closest('[data-oitdel]'); if(oitdel){ deleteOrderItem(oitdel.getAttribute('data-oitdel')); return; }
    var oitrestore = t.closest('[data-oitrestore]'); if(oitrestore){ restoreOrderItem(oitrestore.getAttribute('data-oitrestore')); return; }
    var addorderitembtn = t.closest('[data-addorderitembtn]');
    if(addorderitembtn){
      var oCatId = addorderitembtn.getAttribute('data-addorderitembtn');
      var oInp = tabAdmin.querySelector('[data-neworderitem="'+CSS.escape(oCatId)+'"]');
      if(oInp){ addOrderItem(oCatId, oInp.value); oInp.value=''; }
      return;
    }
    var resetOrderBtn = t.closest('#resetOrderTodayBtn'); if(resetOrderBtn){ confirmResetOrderToday(); return; }
  });
  tabAdmin.addEventListener('change', function(e){
    var catedit = e.target.closest('[data-catedit]'); if(catedit){ editCategoryName(catedit.getAttribute('data-catedit'), catedit.value); return; }
    var itedit = e.target.closest('[data-itedit]'); if(itedit){ editItemName(itedit.getAttribute('data-itedit'), itedit.value); return; }
    var ocatedit = e.target.closest('[data-ocatedit]'); if(ocatedit){ editOrderCategoryName(ocatedit.getAttribute('data-ocatedit'), ocatedit.value); return; }
    var oitedit = e.target.closest('[data-oitedit]'); if(oitedit){ editOrderItemName(oitedit.getAttribute('data-oitedit'), oitedit.value); return; }
  });

  setInterval(function(){ checkDateRollover(); }, 20000);
}

/* ---------- 起動 ---------- */
function boot(){
  deviceId = lsGet('x8oc_device');
  if(!deviceId){ deviceId = genId('dev'); lsSet('x8oc_device', deviceId); }
  currentStaffId = lsGet('x8oc_staff');
  collapsedCats = lsGetJSON('x8oc_collapsed', {});
  filterIncomplete = lsGet('x8oc_filter') === '1';

  renderStaffGate();
  wireEvents();
  document.getElementById('appLoading').style.display='none';
  if(currentStaffId){ showApp(); } else { showStaffGate(); }
  updateStaffChip();
  switchTab(lsGet('x8oc_tab') || 'check');
  updateSyncDot();

  // Firebase接続状態の監視（標準的な .info/connected パス）
  onValue(ref(db, '.info/connected'), function(snap){
    connected = snap.val() === true;
    updateSyncDot();
  });

  // ルート全体をリアルタイム購読。誰かが書き込む度にここが呼ばれ、
  // ページ再読み込みなしで即座に画面へ反映される。
  onValue(rootRef, function(snapshot){
    var val = snapshot.val();
    if(!val || !val.categories || Object.keys(val.categories).length===0){
      categories = DEFAULT_CATEGORIES.slice();
      items = DEFAULT_ITEMS.slice();
      allDays = {};
      set(rootRef, {categories: arrToObj(categories), items: arrToObj(items), days:{}}).catch(function(err){
        console.error('initial seed failed', err);
      });
    } else {
      categories = objToArr(val.categories);
      items = objToArr(val.items);
      allDays = val.days || {};
    }
    orderCategories = (val && val.orderCategories) ? objToArr(val.orderCategories) : [];
    orderItems = (val && val.orderItems) ? objToArr(val.orderItems) : [];
    allOrderDays = (val && val.orderDays) ? val.orderDays : {};
    var today = todayStr();
    currentSubscribedDate = today;
    dayDoc = allDays[today] || {date:today, items:{}};
    orderDayDoc = allOrderDays[today] || {date:today, items:{}};
    renderAll();
  }, function(err){
    console.error('onValue error', err);
    toast('データベースへの接続に失敗しました');
  });
}

document.addEventListener('DOMContentLoaded', boot);

</script>
